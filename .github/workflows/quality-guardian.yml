name: Quality Guardian

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'  # Sunday 3am UTC — weekly full audit

env:
  ASTRO_SITE: https://toytoolsapp.com

jobs:
  pr-quality-check:
    name: PR Quality Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      # fetch-depth: 0 so the version gate below can diff against the PR base. The default shallow
      # checkout has no base commit to compare with, and the gate would skip itself on every PR.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Check coverage thresholds
        run: npm run test:coverage

      # Mirrors the "version + changelog" step in scripts/verify.sh. The base is passed explicitly
      # because origin/main is not the PR base on a fork or a stacked branch; it is empty on push
      # and workflow_dispatch, where the gate falls back to origin/main.
      - name: Version + changelog gate
        run: npm run check:version -- "${{ github.event.pull_request.base.sha }}"

      # Mirrors the "research evidence" step in scripts/verify.sh. Integrity only: a stale report
      # bundle does not fail here, it is caught by `npm run research:status` in the next-tool skill.
      - name: Research evidence check
        run: npm run research:validate

      - name: Install quality-guardian dependencies
        run: npm ci --prefix quality-guardian

      - name: Build site
        run: npm run build
        env:
          KNOWLEDGE_REQUIRED: 'true'  # coverage is 100% — a missing knowledge.ts now fails the PR

      - name: Platform health check
        run: npm run health

      - name: Query coverage check
        run: npm run check:queries

      - name: Tool craft check
        run: npm run check:craft

      - name: Engine shape check
        run: npm run check:engines

      - name: Run quality PR check
        run: npm run quality:pr

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-pr
          path: quality-guardian/reports/

  # Browser E2E on PRs/pushes, both projects, one matrix leg each so they run in parallel and the
  # PR waits no longer than the slower leg.
  #
  # Pixel 5 was weekly-only until 2026-08-17, which meant the fold ratchet never ran on a PR:
  # tests/e2e/fold.spec.ts opens with test.skip(project !== 'pixel5'), so every fold assertion was
  # skipped here, and the craft spec's 48px touch-target branch with it. A phone regression could
  # merge green and only surface in the weekly audit, days later. This is a mobile-first catalog;
  # the phone is the primary target, not the follow-up.
  #
  # Both projects are Chromium (pixel5 is device emulation), so this costs one browser install and
  # no extra download. scripts/verify.sh has always run both — this makes CI match it, per the
  # same-commit rule in CLAUDE.md.
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false        # a desktop failure must not hide a phone failure
      matrix:
        project: [chromium, pixel5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E (${{ matrix.project }})
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/

  # Content quality gate for the tools touched in a PR, and a real merge gate since 2026-08-17.
  #
  # It was non-blocking from the day it was written, because existing tools sat below the bar and a
  # blocking gate would have failed every PR. Its own comment said to flip it "once every tool passes
  # seo:gate", and that is now true: all 107 widget-backed tools pass `seo:gate` and all 14
  # simulations pass `seo:gate:sim`, verified by sweeping every slug individually rather than
  # trusting the changed-tool subset. So the human-voice bar is now enforced on merge.
  #
  # Worth knowing why the sweep mattered: this job only gates directories a branch touches, so six
  # text tools had been failing it unnoticed for weeks. A blocking gate does not remove that blind
  # spot, it only stops new work walking past the bar.
  content-gate:
    name: Content Gate (changed tools)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root + seo-engine dependencies
        run: |
          npm ci
          npm ci --prefix seo-engine

      # seo:gate scores queryTargeting from seo-engine/cache/query-coverage.json, and that artifact
      # is measured against the BUILT pages. Without these two steps the criterion would report
      # "not measured" and quietly skip, which is the failure mode the whole audit was about.
      - name: Build (for the query targeting measurement)
        run: npm run build

      - name: Measure query coverage
        run: npm run check:queries

      # Same failure, different criterion, found on 2026-08-12. seo:gate scores topicCluster from
      # seo-engine/cache/content-graph.json, which is gitignored, so it does not exist in a fresh
      # checkout and CI scored every tool's cluster against a graph that was not there. word-counter
      # measured 67 here and 100 on any machine that had ever run the command, which is a 5 point
      # swing in `overall` and the difference between a green PR and a red one for identical code.
      # seo:gate:sim already chained this step, so the dependency was known and only half wired.
      - name: Export the content graph (for the topic cluster measurement)
        run: npm run seo:graph

      - name: Gate changed tools
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          # Pathspec is 'src/tools/', not 'src/tools/*/*/': git does not expand the latter, so this
          # matched nothing and the gate ran on zero tools on every PR until 2026-08-04.
          # _shared is excluded because two shared widgets have subdirectories (converter/,
          # generator/): without it, touching src/tools/_shared/converter/Foo.astro gates a
          # phantom tool named "converter". Shared widgets are platform code with no content to gate.
          slugs=$(git diff --name-only "$base" HEAD -- 'src/tools/' \
            | grep -E '^src/tools/[^/]+/[^/]+/' \
            | grep -v '^src/tools/_shared/' \
            | sed -E 's#^src/tools/[^/]+/([^/]+)/.*#\1#' | sort -u)
          if [ -z "$slugs" ]; then
            echo "No tool directories changed — nothing to gate."
            exit 0
          fi
          echo "Gating changed tools:"; echo "$slugs"
          status=0
          for slug in $slugs; do
            echo "::group::seo:gate $slug"
            npm run seo:gate -- "$slug" || status=1
            echo "::endgroup::"
          done
          exit $status

  weekly-full-audit:
    name: Weekly Full Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install quality-guardian dependencies
        run: npm ci --prefix quality-guardian

      - name: Install Lighthouse (weekly only)
        run: npm install --prefix quality-guardian lighthouse

      - name: Install browsers (all projects)
        run: npx playwright install --with-deps

      - name: Run full E2E (chromium + pixel5)
        run: npx playwright test
        continue-on-error: true  # report-only on the weekly sweep

      - name: Build site
        run: npm run build

      - name: Run weekly full audit
        run: npm run quality:weekly
        continue-on-error: true  # never fail deployment on weekly audit

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-weekly
          path: quality-guardian/reports/
