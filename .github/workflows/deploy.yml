name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASTRO_SITE: https://toytoolsapp.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          KNOWLEDGE_REQUIRED: 'true'  # enforce 100% knowledge coverage on every deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # deploy-pages polls GitHub's Pages backend; when that queue is congested the deployment
    # can sit in "deployment_queued" past the action's default 10-minute timeout and abort
    # with "Timeout reached, aborting!" even though the build is fine. Give the poll 30
    # minutes (the job cap backstops it) so transient queue latency cannot fail a deploy.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

  # Notify IndexNow (Bing, Yandex, Naver, Seznam, …) after a successful deploy. Isolated in its
  # own job with continue-on-error so IndexNow can NEVER fail the deployment — the CLI also exits
  # 0 on every path (defense in depth). The Pages artifact isn't shared here, so we rebuild to
  # regenerate dist/indexnow-urls.json, which the CLI submits.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (regenerates dist/indexnow-urls.json)
        run: npm run build

      - name: Submit URLs to IndexNow
        run: npm run indexnow
