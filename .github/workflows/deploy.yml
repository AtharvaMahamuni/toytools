name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ASTRO_SITE: https://toytoolsapp.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          KNOWLEDGE_REQUIRED: 'true'  # enforce 100% knowledge coverage on every deploy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The Pages backend fails transiently in two ways: deployments stuck in "deployment_queued"
  # past deploy-pages' polling window (which is hard-capped at 10 minutes — larger values are
  # ignored with a warning), and instant "Deployment failed, try again later." rejections.
  # Neither reflects the build, so a failed deploy gets one automatic second attempt after a
  # short pause before the run is declared failed.
  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy_retry:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always() && needs.deploy.result == 'failure'
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait before retrying
        run: sleep 90
      - name: Deploy to GitHub Pages (retry)
        id: deployment
        uses: actions/deploy-pages@v4

  # Notify IndexNow (Bing, Yandex, Naver, Seznam, …) after a successful deploy. Isolated in its
  # own job with continue-on-error so IndexNow can NEVER fail the deployment — the CLI also exits
  # 0 on every path (defense in depth). The Pages artifact isn't shared here, so we rebuild to
  # regenerate dist/indexnow-urls.json, which the CLI submits.
  indexnow:
    runs-on: ubuntu-latest
    needs: [deploy, deploy_retry]
    # Run when either deploy attempt succeeded (deploy_retry is skipped on first-try success).
    if: always() && (needs.deploy.result == 'success' || needs.deploy_retry.result == 'success')
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (regenerates dist/indexnow-urls.json)
        run: npm run build

      - name: Submit URLs to IndexNow
        run: npm run indexnow
